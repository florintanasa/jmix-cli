[build-system]
requires = ["setuptools>=66.3.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jmix-cli"
version = "0.1.1"
description = "Parametric CLI engine for scaffolding Jmix 2.x / Spring Boot applications from CSV schemas"
readme = { file = "README.md", content-type = "text/markdown" }
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Florin Tanasă", email = "florin.tanasa@gmail.com" }]
keywords = ["jmix", "spring-boot", "code-generator", "liquibase", "flowui", "csv"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Database :: Database Engines/Servers",
]

[project.scripts]
jmix-cli = "jmix_cli.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["jmix_cli*"]
